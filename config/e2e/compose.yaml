services:
  app-postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: zerobudget_e2e
      POSTGRES_USER: zb_e2e_admin
      POSTGRES_PASSWORD: e2e-admin-password
    ports: ["127.0.0.1:${E2E_POSTGRES_PORT}:5432"]
    volumes:
      - app_data:/var/lib/postgresql
      - ./config/e2e/init-runtime.sql:/docker-entrypoint-initdb.d/10-runtime.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U zb_e2e_admin -d zerobudget_e2e",
        ]
      interval: 1s
      timeout: 3s
      retries: 45
  redis:
    image: redis:8-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    command:
      [
        "redis-server",
        "--maxmemory",
        "64mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports: ["127.0.0.1:${E2E_REDIS_PORT}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 45
  keycloak:
    build: ./config/keycloak
    image: zerobudget-keycloak:26.8.1
    command: [start-dev, --import-realm]
    environment:
      KC_HOSTNAME: http://localhost:${E2E_KEYCLOAK_PORT}
    ports: ["127.0.0.1:${E2E_KEYCLOAK_PORT}:8080"]
    volumes: ["${E2E_KEYCLOAK_REALM}:/opt/keycloak/data/import/zerobudget.json:ro"]
  mailpit:
    image: axllent/mailpit:v1.27.10@sha256:b1f1be18af530d939a11ee8820b379e0c88eeec204d904bfad68862adced3a5a
    ports: ["127.0.0.1:${E2E_MAILPIT_PORT}:8025"]

volumes:
  app_data:
