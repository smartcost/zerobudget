name: Backend and E2E
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/tests/e2e/.cache/browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Prepare fixed tooling
        run: ./scripts/e2e setup
      - name: Browser system dependencies (CI only)
        run: node tests/e2e/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: PostgreSQL client for recovery verification
        run: |
          client_dir=$(mktemp -d)
          for client in psql pg_dump pg_restore; do
            ln -s "$GITHUB_WORKSPACE/tests/operations/pg-client" "$client_dir/$client"
          done
          echo "$client_dir" >> "$GITHUB_PATH"
      - name: Real Keycloak, SQL and recovery regression
        run: ./scripts/e2e verify
      - name: MCP protocol and real browser login
        run: ./scripts/e2e mcp-check
      - name: Cleanup owned E2E resources
        if: always()
        run: ./scripts/e2e clean
      - name: Publish sanitized results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-junit
          path: tests/e2e/.runs/*/junit.xml
          retention-days: 7
