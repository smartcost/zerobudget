services:
  app-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: zerobudget
      POSTGRES_USER: zerobudget_admin
      POSTGRES_PASSWORD: app-admin-dev-password
    ports:
      - "127.0.0.1:${APP_POSTGRES_PORT:-5440}:5432"
    volumes:
      - app_postgres_data:/var/lib/postgresql
      - ./config/app-postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - auth-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerobudget_admin -d zerobudget"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${AUTH_REDIS_PORT:-6380}:6379"
    volumes:
      - auth_redis_data:/data
    networks:
      - auth-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak-db-dev-password
    volumes: [keycloak_postgres_data:/var/lib/postgresql]
    networks: [auth-network]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U keycloak -d keycloak"]
      interval: 3s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27.10@sha256:b1f1be18af530d939a11ee8820b379e0c88eeec204d904bfad68862adced3a5a
    ports: ["127.0.0.1:${MAILPIT_PORT:-8025}:8025"]
    networks: [auth-network]
  keycloak:
    build: ./config/keycloak
    image: zerobudget-keycloak:26.8.1
    command: [start-dev, --import-realm]
    ports: ["127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak-db-dev-password
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_BOOTSTRAP_ADMIN_USERNAME: operator
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-keycloak-operator-password
    volumes: ["./config/keycloak/realm.json:/opt/keycloak/data/import/zerobudget.json:ro"]
    networks: [auth-network]
    depends_on:
      keycloak-postgres: {condition: service_healthy}
      mailpit: {condition: service_started}

networks:
  auth-network:
    driver: bridge

volumes:
  auth_redis_data:
  app_postgres_data:
  keycloak_postgres_data:
